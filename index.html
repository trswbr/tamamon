<!DOCTYPE html>
<html lang="de">
    <head>
        <meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1.0"/>
        <title>TamaMon</title>
        <link rel="stylesheet" href="src/css/index.css">
    </head>
    <body>
        <div class="tamaborder">
        <div class="tamagotchi">
        
            <div class="pet">
                <div class="info">
                    <p id="poke-name"></p>
                    <div class="device">
                        <img class="tech" src="src/assets/tamagotchis/heart-pink.png"/>
                        <div class="picture" id="poke-img"></div>
                    </div>
                </div>
                <div class="stats">

                    <div class="affection-bar">
                        <div class="heart-gauge" >
                            <div class="heart-bg">
                                <div class="heart-fill" ></div>
                                <div id="poke-aff"></div>
                            </div>
                        </div>
                    </div>

                    <div class="progressbar-item">
                        <p>HP:</p>
                        <div class="progress-bar">
                            <div class="progress-number">
                                <div class="progress-number-mark">
                                    <span class="percent" id="poke-hp"></span>
                                    <span class="down-arrow"></span>
                                </div>
                            </div>
                            <div class="progress-bg">
                                <div class="progress-fill"></div>
                            </div>
                        </div>
                    </div>

                    <div class="circle-stats">
                        <div class="stat-hunger">
                            <div class="hunger-bar"></div>
                            <p class="hunger-title">Hunger</p>
                            <div class="hunger-number" id="poke-hung"></div>
                        </div>

                        <div class="stat-fun">
                            <div class="fun-bar"></div>
                            <p class="fun-title">Spaß</p>
                            <div class="fun-number" id="poke-fun"></div>
                        </div>
                        
                        <div class="stat-energy">
                            <div class="energy-bar"></div>
                            <p class="energy-title">Energie</p>
                            <div class="energy-number" id="poke-engy"></div>
                        </div>
                    </div>
                    

                </div>
            </div>
            <div class="controls">
                <button id="poke-feed">füttern</button>
                <button id="poke-play">spielen</button>
                <button id="poke-sleep" disabled>schlafen</button>
                <button id="poke-pet">streicheln</button>
            </div>
        </div>
        </div>

        <script src="src/components/needs.js" defer></script>
        <script src="src/components/pokemon.js" defer></script>
        <script src="src/app.js" defer></script>
    </body>
</html>
